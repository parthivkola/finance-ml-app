services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: kola
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: finance-market-intelligence-platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kola -d finance-market-intelligence-platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://kola:secret@postgres:5432/finance-market-intelligence-platform
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    volumes:
      - model_artifacts:/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  model_artifacts:
